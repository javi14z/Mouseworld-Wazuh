[supervisord]
nodaemon=true

# Ejecuto el servicio de ssh
[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
stdout_logfile=/var/log/sshd.log
stderr_logfile=/var/log/sshd_error.log 

# Ejecuto el servicio de ssh
[program:sshd]
command=/var/ossec/bin/wazuh-control start
autostart=true
autorestart=true
stdout_logfile=/var/log/wazuh.log
stderr_logfile=/var/log/wazuh_error.log 


